<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <!-- Skin Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD3B6"/>
      <stop offset="100%" stop-color="#F6BA8E"/>
    </linearGradient>
    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>
    <!-- Jacket / Clothing Gradient -->
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Background Circle / Portrait backdrop -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad)"/>
  <circle cx="100" cy="100" r="92" fill="#FFFFFF" opacity="0.35"/>

  <!-- Shoulders & Clothing -->
  <!-- Inner White Collar/Shirt -->
  <path d="M72 155 L100 185 L128 155 Z" fill="#FFFFFF"/>
  <path d="M85 160 L100 195 L115 160 Z" fill="#047857" opacity="0.18"/>

  <!-- Deep Emerald Jacket -->
  <path d="M35 200 C35 165 60 145 76 142 L100 170 L124 142 C140 145 165 165 165 200 Z" fill="url(#jacketGrad)"/>
  <path d="M76 142 L95 180" stroke="#064E3B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M124 142 L105 180" stroke="#064E3B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M86 120 L86 150 C86 158 114 158 114 150 L114 120 Z" fill="url(#skinGrad)"/>
  <ellipse cx="100" cy="126" rx="16" ry="6" fill="#E2A676" opacity="0.6"/>

  <!-- Head Base / Face -->
  <path d="M68 85 C68 55 132 55 132 85 C132 118 118 132 100 132 C82 132 68 118 68 85 Z" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <ellipse cx="67" cy="92" rx="6" ry="10" fill="#F6BA8E"/>
  <ellipse cx="68" cy="92" rx="3" ry="6" fill="#E2A676"/>
  <ellipse cx="133" cy="92" rx="6" ry="10" fill="#F6BA8E"/>
  <ellipse cx="132" cy="92" rx="3" ry="6" fill="#E2A676"/>

  <!-- Cheeks / Warmth -->
  <ellipse cx="78" cy="100" rx="7" ry="4" fill="#F87171" opacity="0.25"/>
  <ellipse cx="122" cy="100" rx="7" ry="4" fill="#F87171" opacity="0.25"/>

  <!-- Eyebrows -->
  <path d="M76 77 Q86 73 93 76" stroke="#2D3748" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M124 77 Q114 73 107 76" stroke="#2D3748" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="84" cy="85" rx="5.5" ry="6" fill="#1A202C"/>
  <circle cx="86" cy="83" r="2" fill="#FFFFFF"/>
  <circle cx="83" cy="87" r="1" fill="#FFFFFF"/>

  <ellipse cx="116" cy="85" rx="5.5" ry="6" fill="#1A202C"/>
  <circle cx="118" cy="83" r="2" fill="#FFFFFF"/>
  <circle cx="115" cy="87" r="1" fill="#FFFFFF"/>

  <!-- Nose -->
  <path d="M100 84 L97 97 Q100 100 103 97" stroke="#E2A676" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Friendly Smile with Teeth -->
  <path d="M86 106 Q100 120 114 106" stroke="#991B1B" stroke-width="2" fill="#FFFFFF"/>
  <path d="M86 106 Q100 120 114 106" stroke="#991B1B" stroke-width="2" fill="none"/>
  <path d="M84 106 Q87 108 89 106" stroke="#E2A676" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M116 106 Q113 108 111 106" stroke="#E2A676" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Modern Hair -->
  <path d="M66 82 C64 60 75 42 100 42 C125 42 136 60 134 82 C131 75 125 68 115 67 C100 66 90 70 85 75 C80 78 72 78 66 82 Z" fill="url(#hairGrad)"/>
  <path d="M68 80 L68 90 L72 85 Z" fill="#2D3748"/>
  <path d="M132 80 L132 90 L128 85 Z" fill="#2D3748"/>
  <path d="M88 47 Q104 45 118 49" stroke="#4A5568" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
